<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אוצר מילים יומי</title>
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiYXXXei3Vk5iBBHdGIq7Vk5-Vk5iBBHdGIq7Vk5-Vk5iBBHdGIq7Vk5+Vk5iBBHdGIqrbmFtZSI6IkRhaWx5IFZvY2FiIiwic2hvcnRfbmFtZSI6IlZvY2FiIiwic3RhcnRfdXJsIjoiLyIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiNmZmZmZmYiLCJ0aGVtZV9jb2xvciI6IiM0Mjg1ZjQiLCJpY29ucyI6W119">
    <meta name="theme-color" content="#4285f4">

    <style>
        /* General Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 20px auto; background: rgba(255, 255, 255, 0.98); border-radius: 20px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 20px; }
        .title { font-size: 2rem; font-weight: bold; color: #4285f4; margin-bottom: 10px; }
        .date { color: #666; font-size: 1rem; }
        .group-display { background-color: #9b59b6; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-top: 10px; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; text-align: center; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-weight: 600; border: 1px solid #ddd; background: #f0f0f0; color: #555; }
        .tab.active { background: #4285f4; color: white; border-color: #4285f4; box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .difficult-count { background: #e74c3c; color: white; border-radius: 10px; padding: 2px 6px; font-size: 0.8rem; margin-right: 5px; }

        /* Word Cards */
        .word-card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-right: 4px solid #4285f4; transition: transform 0.2s; }
        .word-card:hover { transform: translateY(-3px); }

        .word-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .english-word { font-size: 1.5rem; font-weight: 700; color: #2c3e50; }
        .word-actions { margin-right: auto; display: flex; gap: 10px; }
        
        /* Word Card Action Buttons */
        .play-button, .difficult-button, .remove-button {
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        /* ספציפי לכפתור ההשמעה */
        .play-button {
            background: #28a745; /* ירוק */
            color: white;
        }
        .play-button:hover {
            background: #218838;
            transform: scale(1.1);
        }

        /* ספציפי לכפתור הוספה לקשות */
        .difficult-button {
            background: #c0392b; /* צהוב */
            color: #333; /* טקסט כהה על צהוב */
        }
        .difficult-button.saved { /* כשהמילה כבר נשמרה כקשה */
            background: #fd7e14; /* כתום כהה יותר */
            color: white;
        }
        .difficult-button:hover {
            background: #e67e22;
            transform: scale(1.1);
        }

        /* ספציפי לכפתור הסרה (מהקשות) */
        .remove-button {
            background: #95a5a6; /* אדום */
            color: white;
        }
        .remove-button:hover {
            background: #7f8c8d;
            transform: scale(1.1);
        }

        /* Fields */
        .field { margin-bottom: 15px; }
        .field-label { font-weight: 600; color: #4285f4; margin-left: 5px; font-size: 0.9rem; display: block; margin-bottom: 5px; }
        .field-content { color: #333; }
        .hebrew { font-size: 1.1rem; }
        .pronunciation { font-style: italic; color: #555; }
        .definition, .example { line-height: 1.6; direction: ltr; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #eee; }

        /* States & Buttons */
        .loading, .error, .empty-state { text-align: center; padding: 40px; color: #666; }
        .button-group { text-align: center; margin-top: 20px; }
        .refresh-btn { background: #4285f4; color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 1rem; cursor: pointer; margin: 5px; transition: background 0.3s; font-weight: 600; }
        .refresh-btn:hover { background: #3367d6; }
        
        /* Quiz */
        #quizFeedback { font-weight: bold; margin-top: 15px; min-height: 24px; text-align: center; }
        .answer-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 1.1rem; text-align: right; direction: ltr; cursor: pointer; border-radius: 12px; border: 2px solid #eee; background: white; transition: all 0.2s; }
        .answer-btn:hover:not(:disabled) { border-color: #4285f4; transform: translateY(-2px); }
        .answer-btn:disabled { cursor: not-allowed; opacity: 0.8; }
        .answer-btn.correct { background-color: #d4edda; border-color: #27ae60; }
        .answer-btn.incorrect { background-color: #f8d7da; border-color: #e74c3c; }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="header">
            <h1 class="title">אוצר מילים היסטורי</h1>
            <div class="date" id="currentDate"></div>
            <div class="group-display" id="groupDisplay">📖 קבוצה: ...</div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('daily')">מילים יומיות</button>
            <button class="tab" onclick="switchTab('difficult')">
                מילים קשות <span class="difficult-count" id="difficultCount">0</span>
            </button>
        </div>

        <div id="dailyTab" class="tab-content active">
            <div id="dailyContent"><div class="loading">טוען מילים...</div></div>
        </div>

        <div id="difficultTab" class="tab-content">
            <div id="difficultContent"></div>
        </div>
    </div>

    <div class="container" id="quizContainer" style="display: none;">
        <div class="header"> <h1 class="title">בחן את עצמך</h1> </div>
        <div id="questionContainer">
            <p id="questionText" style="text-align: center; font-size: 1.2rem; margin-bottom: 20px;">טוען שאלה...</p>
            <div id="answersContainer"></div>
        </div>
        <div id="quizFeedback"></div>
        <div id="quizProgress" style="text-align: center; color: #666; margin-top: 10px;">
            שאלה <span id="currentQuestionNum">1</span> / <span id="totalQuestionsNum">5</span>
        </div>
        <div class="button-group" style="margin-top: 20px;">
            <button id="nextQuestionBtn" class="refresh-btn" style="display: none;">השאלה הבאה</button>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1uFypL_pbx5rGrcqzT-GvqCdz6TyXxlBSR-dOtPgQoAo/export?format=csv&gid=986656386'; // !!! החלף בקישור שלך
        const DIFFICULT_WORDS_KEY = 'difficult_words_v2';
        const CACHE_KEY = 'daily_words_cache_v2';

        let currentTab = 'daily';
        let currentWords = [];
        let difficultWords = [];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentDate').textContent = `תאריך: ${new Date().toLocaleDateString('he-IL')}`;
            loadDifficultWords();
            updateDifficultCount();
            loadWords();
        });
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            if (tab === 'daily') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('dailyTab').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('difficultTab').classList.add('active');
                displayDifficultWords();
            }
        }

        function loadDifficultWords() {
            difficultWords = JSON.parse(localStorage.getItem(DIFFICULT_WORDS_KEY) || '[]');
        }

        function saveDifficultWords() {
            localStorage.setItem(DIFFICULT_WORDS_KEY, JSON.stringify(difficultWords));
        }

        function addToDifficult(word) {
            if (!isDifficultWord(word.English)) {
                difficultWords.push(word);
                saveDifficultWords();
                updateDifficultCount();
                const button = document.querySelector(`.difficult-button[onclick*="${word.English.replace(/'/g, "\\'")}"]`);
                if (button) {
                    button.classList.add('saved');
                    button.innerHTML = '★';
                }
            }
        }

        function removeFromDifficult(englishWord) {
            difficultWords = difficultWords.filter(w => w.English !== englishWord);
            saveDifficultWords();
            updateDifficultCount();
            displayDifficultWords();
        }
        
        function updateDifficultCount() {
            document.getElementById('difficultCount').textContent = difficultWords.length;
        }

        function isDifficultWord(englishWord) {
            return difficultWords.some(w => w.English === englishWord);
        }

        async function loadWords(forceRefresh = false) {
            const content = document.getElementById('dailyContent');
            content.innerHTML = '<div class="loading">טוען מילים...</div>';
            try {
                let words = !forceRefresh ? getCachedWords() : null;
                if (!words) {
                    words = await fetchWords();
                    cacheWords(words);
                }
                displayWords(words);
            } catch (error) {
                console.error('Error:', error);
                content.innerHTML = `<div class="error">שגיאה בטעינת המילים: ${error.message}</div>`;
            }
        }

        async function fetchWords() {
            const response = await fetch(SHEET_URL);
            if (!response.ok) throw new Error('Network response was not ok');
            const text = await response.text();
            const allWords = parseCSV(text);

            if (allWords.length === 0) throw new Error('No valid words found.');
            const groupIds = [...new Set(allWords.map(w => w.Daily_Group_ID).filter(id => id))];
            if (groupIds.length === 0) throw new Error('"Daily_Group_ID" column is missing or empty.');

            const randomGroupId = groupIds[Math.floor(Math.random() * groupIds.length)];
            return allWords.filter(w => w.Daily_Group_ID === randomGroupId);
        }
        
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            return lines.slice(1).map(line => {
                const values = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
                let word = {};
                headers.forEach((header, index) => {
                    word[header] = (values[index] || '').trim().replace(/^"|"$/g, '');
                });
                return word;
            }).filter(word => word.English && word.Hebrew);
        }

        function getCachedWords() {
            const cached = localStorage.getItem(CACHE_KEY);
            if (!cached) return null;
            const data = JSON.parse(cached);
            return (data.date === new Date().toDateString() && data.words) ? data.words : null;
        }

        function cacheWords(words) {
            localStorage.setItem(CACHE_KEY, JSON.stringify({ date: new Date().toDateString(), words }));
        }
        
        function displayWords(words) {
            const content = document.getElementById('dailyContent');
            currentWords = words;

            // Update the group display
            document.getElementById('groupDisplay').textContent = `📖 קבוצה #${words[0].Daily_Group_ID}`;

            let html = ''; 
            words.forEach((word, index) => {
                const isSaved = isDifficultWord(word.English);
                html += `
                    <div class="word-card">
                        <div class="word-header">
                            <div class="english-word">${word.English}</div>
                            <div class="word-actions">
                                <button class="play-button" onclick="speakWord('${word.English}')" title="הקרא">🔊</button>
                                <button class="difficult-button ${isSaved ? 'saved' : ''}" onclick="addToDifficult(currentWords[${index}])" title="הוסף לקשות">${isSaved ? '★' : '⚠️'}</button>
                            </div>
                        </div>
                        <div class="field"><span class="field-label">תרגום:</span><div class="field-content hebrew">${word.Hebrew}</div></div>
                        <div class="field"><span class="field-label">הגייה:</span><div class="field-content pronunciation">${word.Pronunciation}</div></div>
                        <div class="field"><span class="field-label">הגדרה:</span><div class="field-content definition">${word.Definition}</div></div>
                        <div class="field"><span class="field-label">דוגמה היסטורית:</span><div class="field-content example">${word.Example}</div></div>
                    </div>
                `;
            });
            content.innerHTML = html;
            const buttonGroup = document.createElement('div');
            buttonGroup.className = 'button-group';
            buttonGroup.innerHTML = `
                <button class="refresh-btn" onclick="loadWords(true)">טען קבוצה אחרת</button>
                <button class="refresh-btn" onclick="startQuiz()" style="background: #27ae60;">💪 בחן את עצמך!</button>
            `;
            content.appendChild(buttonGroup);
        }

        function displayDifficultWords() {
            const content = document.getElementById('difficultContent');
            if (difficultWords.length === 0) {
                content.innerHTML = '<div class="empty-state">אין מילים שמורות.</div>';
                return;
            }
            content.innerHTML = difficultWords.map(word => `
                <div class="word-card">
                    <div class="word-header">
                        <div class="english-word">${word.English}</div>
                        <div class="word-actions">
                            <button class="play-button" onclick="speakWord('${word.English}')">🔊</button>
                            <button class="remove-button" onclick="removeFromDifficult('${word.English}')">🗑️</button>
                        </div>
                    </div>
                    <div class="field"><span class="field-label">תרגום:</span><div class="field-content hebrew">${word.Hebrew}</div></div>
                </div>
            `).join('');
        }

        let quizWords = [], currentQuestionIndex = 0, score = 0;

        function startQuiz() {
            quizWords = (currentTab === 'daily') ? [...currentWords] : [...difficultWords];
            if (quizWords.length < 4) {
                alert('צריך לפחות 4 מילים בקבוצה כדי להתחיל בוחן.');
                return;
            }
            currentQuestionIndex = 0; score = 0;
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('quizContainer').style.display = 'block';
            displayQuestion();
        }

        function displayQuestion() {
            const questionWord = quizWords[currentQuestionIndex];
            document.getElementById('questionText').textContent = `מה התרגום של: "${questionWord.Hebrew}"?`;
            const options = generateOptions(questionWord);
            const answersContainer = document.getElementById('answersContainer');
            answersContainer.innerHTML = '';
            options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'answer-btn';
                button.textContent = option;
                button.onclick = () => checkAnswer(button, option, questionWord.English);
                answersContainer.appendChild(button);
            });
            document.getElementById('currentQuestionNum').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQuestionsNum').textContent = quizWords.length;
            document.getElementById('nextQuestionBtn').style.display = 'none';
            document.getElementById('quizFeedback').textContent = '';
        }

        function generateOptions(correctWord) {
            let options = [correctWord.English];
            let allOtherWords = [...currentWords, ...difficultWords].filter(w => w.English !== correctWord.English);
            const uniqueWords = [...new Map(allOtherWords.map(item => [item.English, item])).values()];
            while (options.length < 4 && uniqueWords.length > 0) {
                const randomIndex = Math.floor(Math.random() * uniqueWords.length);
                options.push(uniqueWords.splice(randomIndex, 1)[0].English);
            }
            return options.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(selectedButton, selectedOption, correctOption) {
            const feedback = document.getElementById('quizFeedback');
            document.querySelectorAll('.answer-btn').forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correctOption) btn.classList.add('correct');
                else if (btn === selectedButton) btn.classList.add('incorrect');
            });
            if (selectedOption === correctOption) {
                score++;
                feedback.textContent = 'מעולה! 👍';
                feedback.style.color = '#27ae60';
            } else {
                feedback.textContent = 'טעות... התשובה הנכונה סומנה בירוק.';
                feedback.style.color = '#e74c3c';
            }
            const nextBtn = document.getElementById('nextQuestionBtn');
            nextBtn.style.display = 'block';
            if (currentQuestionIndex < quizWords.length - 1) {
                nextBtn.textContent = 'השאלה הבאה';
                nextBtn.onclick = () => { currentQuestionIndex++; displayQuestion(); };
            } else {
                nextBtn.textContent = 'סיים וצפה בתוצאה';
                nextBtn.onclick = showResults;
            }
        }

        function showResults() {
            document.getElementById('quizContainer').innerHTML = `
                <div class="header"><h1 class="title">הבוחן הסתיים!</h1></div>
                <div style="text-align: center; font-size: 1.5rem; margin: 30px 0;">
                    הציון שלך: <span style="font-weight: bold; color: #4285f4;">${score} / ${quizWords.length}</span>
                </div>
                <div class="button-group">
                    <button class="refresh-btn" onclick="window.location.reload()">חזור למסך הראשי</button>
                </div>
            `;
        }

        function speakWord(word) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                speechSynthesis.speak(utterance);
            } else {
                alert('הדפדפן שלך אינו תומך בהקראה קולית.');
            }
        }

        // Service Worker registration for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').then(registration => {
                    console.log('ServiceWorker registration successful');
                }).catch(err => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
